# Free, no-credit-card path: Render builds the Dockerfile and gives a public
# https://<name>.onrender.com URL. 512 MB / 0.1 CPU, so one small rip at a time.
services:
  - type: web
    name: musico
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: MAX_TRACKS
        value: "12"
      - key: MAX_CONCURRENT
        value: "1"
      - key: MAX_DISK_MB
        value: "250"
      - key: TTL_MINUTES
        value: "30"
      - key: RIPS_PER_HOUR
        value: "2"
